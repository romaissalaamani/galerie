<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie de photos interactive</title>
    <script src="Photo_Gallery.js"> </script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
        }

        #image {
            width: 550px;
            height: 450px;
            margin: 20px auto;
            border: 3px solid #555;
            background-color: #ddd;
            background-image: url("");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 1.2em;
            font-weight: bold;
        }

        #gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        #gallery img {
            width: 200px;
            height: 250px;
            object-fit: cover;
            border: 2px solid #999;
            border-radius: 0px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        #gallery img:hover {
            transform: scale(1.05);
            border-color: #333;
        }
    </style>
</head>

<body>

    <h1>Galerie de photos</h1>
    <div id="image">Hover over an image below to display here.</div>
    <div id="gallery">
        <img src="https://plus.unsplash.com/premium_photo-1673967831980-1d377baaded2?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"  onmouseover="upDate(this)"
            onmouseout="undo()">
        <img src="http://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"  onmouseover="upDate(this)"
            onmouseout="undo()">
        <img src="https://images.unsplash.com/photo-1592194996308-7b43878e84a6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"  onmouseover="upDate(this)"
            onmouseout="undo()">
        <img src="https://plus.unsplash.com/premium_photo-1667030474693-6d0632f97029?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"  onmouseover="upDate(this)"
            onmouseout="undo()">
        <img src="https://images.unsplash.com/photo-1774876267601-501fa7d17ac7?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"  onmouseover="upDate(this)"
            onmouseout="undo()">
    </div>

   

</body>

</html>
